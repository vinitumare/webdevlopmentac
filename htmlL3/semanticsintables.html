<!DOCTYPE html>
<html lang="en">
<head>

    <title>Semantics in Tables</title>
</head>
<body>
     <table>
        <caption>Food Menu</caption>
        <thead>
            <tr>
              <th>Items</th>
              <th>Price</th>
            </tr>

        </thead>
        <tbody>
             <tr>
                 <td>Frooti</td>
                 <td>10</td>
             </tr>
              <tr>
                 <td>Samosa</td>
                 <td>12</td>
              </tr>
               <tr>
                 <td>Chips</td>

               </tr>




        </tbody>
       
    </table>

    
</body>
</html>
