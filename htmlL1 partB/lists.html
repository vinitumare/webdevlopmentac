<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lists in HTML</title>
</head>
<body>
    
    <P>UNORDERED LISTS </P>
    <ul>
        <li>Bread</li>
        <li>Butter</li>
        <li>Jam</li>
    </ul>

    <p>ORDERED LISTS</p>
    <ol>
        <li>Bread</li>
        <li>Butter</li>
        <li>Jam</li>
    </ol>


    <ol>
        <li>Bread
            <ul>wheat bread</ul>
            <ul>brown bread</ul>
            <ul>milk bread</ul>
        </li>
        <li>Butter</li>
        <li>Jam</li>
</body>
</html>
